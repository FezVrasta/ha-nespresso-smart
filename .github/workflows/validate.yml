name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # HACS and hassfest both change over time, so re-run against an unchanged
  # repo to catch breakage introduced upstream rather than by a commit here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master
